<body>
<div id="toast" hidden></div>
<div id="net" hidden>Переподключение…</div>

<div id="react" hidden></div>

<div class="sheet" id="radio">
  <div class="sh"><b>📻 Радио за столом</b><button class="ico" onclick="toggleRadio()" aria-label="Закрыть">✕</button></div>
  <div id="rnow" style="font-size:13px;opacity:.85"></div>
  <div id="rlist"></div>
  <div class="rctl"><button class="btn ghost" id="rmute" onclick="rMute()"></button><input type="range" id="rvol" min="0" max="100" oninput="rVol(this.value)"><span id="rvl" style="min-width:38px;text-align:right;font-size:13px"></span></div>
  <div id="rhint" style="font-size:12px;opacity:.65"></div>
</div>

  <div class="sh"><b>Чат</b><button class="ico" onclick="toggleChat()" aria-label="Закрыть чат">✕</button></div>
  <div id="log"></div>
  <div class="quick"><button onclick="say('Ваш ход!')">Ваш ход!</button><button onclick="say('Бито')">Бито</button><button onclick="say('Ну вы даёте')">Ну вы даёте</button><button onclick="say('gg')">gg</button></div>
  <div class="row" style="flex-wrap:nowrap"><input id="ci" maxlength="80" placeholder="Сообщение" onkeydown="if(event.key=='Enter')say()"><button class="btn" onclick="say()">➤</button></div>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(location.pathname.indexOf('/chess')==0)document.body.classList.add('chess');else if(location.pathname.indexOf('/mafia')==0)document.body.classList.add('mafia');else if(location.pathname.indexOf('/billiards')==0)document.body.classList.add('billiards');
try{tg.ready();tg.expand();tg.setHeaderColor('#0d5238');tg.setBackgroundColor('#04241a')}catch(e){}
const INVITES={durak:'https://t.me/duraktelega_bot/durakvtelege',chess:'https://t.me/duraktelega_bot/chess',mafia:'https://t.me/duraktelega_bot/mafia',billiards:'https://t.me/duraktelega_bot/billiards'};
const RK=['6','7','8','9','10','В','Д','К','Т'],SU=['♠','♥','♦','♣'],EMO=['👍','😂','😮','😡','🔥','👏','😎','🤝'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const U=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
let uid;try{uid=U?'tg'+U.id:(localStorage.uid=localStorage.uid||Math.random().toString(36).slice(2))}catch(e){uid=Math.random().toString(36).slice(2)}
let ws,st,cur,selT=null,seen=new Set(),next,logSeen=0,chatOpen=false,idleAt=0;
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const key=c=>c.r+'-'+c.s;
const hap=t=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
/*CHESS*/
let chGame=location.pathname.indexOf('/chess')==0?'chess':location.pathname.indexOf('/mafia')==0?'mafia':location.pathname.indexOf('/billiards')==0?'billiards':'durak',chSel=null,chPromo=null,chTc=10,chAt=0,prevHist=-1,chPrevOver=false,chAnim=false;
const GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},VAL={p:1,n:3,b:3,r:5,q:9},INIT={p:8,n:2,b:2,r:2,q:1};
const gl=t=>GL[t.toLowerCase()]+'\uFE0E',fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const clkNow=c=>st&&st.clk?Math.max(0,st.clk[c]-(st.clk.run&&st.clk.turn==c?Date.now()-chAt:0)):0;
const RS={mate:'Мат',resign:'Сдача',time:'Время вышло',stalemate:'Пат',agreed:'Ничья по согласию',repetition:'Троекратное повторение',insufficient:'Недостаточно материала',fifty:'Правило 50 ходов',leave:'Соперник покинул игру'};
function fenRows(f){return f.split(' ')[0].split('/').map(r=>{const a=[];for(const c of r){if(c>='1'&&c<='8')for(let i=0;i<+c;i++)a.push('');else a.push(c)}return a})}
function caps(f){const n={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}};
  for(const row of fenRows(f))for(const c of row){if(!c||c.toLowerCase()=='k')continue;n[c==c.toUpperCase()?'w':'b'][c.toLowerCase()]++}
  const mk=col=>{const s=[];let v=0;for(const t of 'qrbnp'){const m=Math.max(0,INIT[t]-n[col][t]);for(let i=0;i<m;i++)s.push(t);v+=m*VAL[t]}return{s,v}};
  return{w:mk('b'),b:mk('w')}}   // w: что взяли белые (черные фигуры), b: что взяли черные
function chSound(){const san=st.hist[st.hist.length-1]||'';snd(/[+#]/.test(san)?'check':/x/.test(san)?'cap':'move');hap('light')}
function boardHTML(){const rows=fenRows(st.fen),flip=st.col=='b',mv=st.moves||{},L=st.last;
  const disp=n=>{const c='abcdefgh'.indexOf(n[0]),r=8-+n[1];return flip?[7-c,7-r]:[c,r]};let h='';
  for(let ri=0;ri<8;ri++)for(let ci=0;ci<8;ci++){const r=flip?7-ri:ri,c=flip?7-ci:ci,n='abcdefgh'[c]+(8-r),p=rows[r][c],light=(r+c)%2==0;
    const isK=p&&p.toLowerCase()=='k'&&(p==p.toUpperCase()?'w':'b')==st.turn;
    const cls='sq '+(light?'l':'d')+(L&&(n==L.from||n==L.to)?' lm':'')+(chSel==n?' sel':'')+(st.check&&isK?' chk':'');
    const tg=chSel&&mv[chSel]&&mv[chSel].includes(n);let anim='';
    if(chAnim&&L&&n==L.to){const f=disp(L.from),t=disp(L.to);anim=` mv" style="--dx:${(f[0]-t[0])*100}%;--dy:${(f[1]-t[1])*100}%`}
    h+=`<div class="${cls}" onclick="chTap('${n}')">${p?`<span class="pz ${p==p.toUpperCase()?'w':'b'}${anim}">${gl(p)}</span>`:''}${tg?`<i class="${p?'cap':'dot'}"></i>`:''}${ci==0?`<b class="co r">${8-r}</b>`:''}${ri==7?`<b class="co f">${'abcdefgh'[c]}</b>`:''}</div>`}
  return h}
function chTap(s){if(!st||st.status!='play')return;const mv=st.moves||{};
  if(chSel&&mv[chSel]&&mv[chSel].includes(s)){if((st.promo||[]).includes(chSel+s)){chPromo={from:chSel,to:s};draw();return}
    send({t:'move',from:chSel,to:s});chSel=null;return}
  const p=fenRows(st.fen)[8-+s[1]]['abcdefgh'.indexOf(s[0])];chSel=(p&&mv[s])?s:null;draw()}
function chResign(){const f=()=>send({t:'resign'});tg&&tg.showConfirm?tg.showConfirm('Сдаться?',ok=>ok&&f()):confirm('Сдаться?')&&f()}
function chBar(j){const p=st.players[j],c=p.col,cs=caps(st.fen),cp=cs[c],adv=(c=='w'?1:-1)*(cs.w.v-cs.b.v);
  return `<div class="pb ${st.status=='play'&&st.turn==c?'turn':''}" id="seat-${j}" onclick="showProf(${j})">${av({...p,n:''})}<div class="info"><div class="nm" style="max-width:none">${esc(p.name)}${p.bot?' 🤖':''}${p.left?' 🚪':p.off?' 📵':''}</div>${p.prof?`<div class="rt">${rankOf(p.prof.rating).n} · ${p.prof.rating}</div>`:''}<div class="cp">${cp.s.map(t=>`<span class="${c=='w'?'bk':'wh'}">${gl(t)}</span>`).join('')}${adv>0?`<b>+${adv}</b>`:''}</div></div><div class="clk" data-s="${c}">${fmtT(clkNow(c))}</div></div>`}
function chLobby(a){a.innerHTML=`${sndBtn()}<h1 style="font-size:40px;margin-top:20px">Шахматы</h1><p class="sub">Комната <b style="color:var(--gold)">${esc(st.room)}</b>: ждем соперника</p>
  <div class="lob">${st.players.map((p,j)=>`<div class="seat" onclick="showProf(${j})" style="animation:pop .4s backwards">${av({...p,n:''})}<div class="nm">${esc(p.name)}</div>${p.prof?`<div class="rt">${rankOf(p.prof.rating).n} · ${p.prof.rating}</div>`:`<div class="role">${p.bot?'🤖 бот':'&nbsp;'}</div>`}</div>`).join('')}</div>
  <p class="sub" style="margin-top:14px">Время на партию каждому</p>
  <div class="row">${[3,5,10,15].map(t=>`<button class="btn ${chTc==t?'':'ghost'}" onclick="chTc=${t};draw()">${t} мин</button>`).join('')}</div><div style="flex:1"></div>
  <div class="row"><button class="btn ghost" onclick="share()">Пригласить</button><button class="btn ghost" onclick="toggleRadio()">📻 Радио</button><button class="btn ghost" onclick="send({t:'bot'})" ${st.players.length>=2?'disabled':''}>+ Компьютер</button><button class="btn" onclick="send({t:'start',tc:chTc})" ${st.players.length<2?'disabled':''}>Начать</button></div>`}
function drawChess(a){
  if(st.status=='lobby'){chLobby(a);prevHist=-1;chPrevOver=false;return}
  const me=st.you,opp=1-me,n=st.hist.length;
  chAnim=prevHist>=0&&n==prevHist+1;
  if(n!=prevHist){if(prevHist>=0&&n>prevHist)chSound();chSel=null;chPromo=null}
  prevHist=n;
  if(st.over&&!chPrevOver)snd(st.win==me?'win':st.win<0?'turn':'lose',.35);
  chPrevOver=st.over;
  const myTurn=st.status=='play'&&st.turn==st.col;
  let msg=st.over?'Партия окончена':myTurn?(st.check?'⚠️ Вам шах! Ваш ход':'Ваш ход'):'Ход соперника…';
  if(st.players[opp].off&&!st.over)msg='📵 Соперник потерял связь…';
  const dr=st.draw!=null&&st.status=='play'?(st.draw==me?'🤝 Ничья предложена…':`🤝 Соперник предлагает ничью <button class="btn" style="padding:6px 12px" onclick="send({t:'accept'})">Принять</button> <button class="btn ghost" style="padding:6px 12px" onclick="send({t:'decline'})">Нет</button>`):'';
  const ml=[];for(let i=0;i<n;i+=2)ml.push(`<span><i>${i/2+1}.</i>${st.hist[i]} ${st.hist[i+1]||''}</span>`);
  const unread=chatOpen?0:st.logN-logSeen,rr=(st.rres||[]).find(x=>x.i==me);
  const ov=st.over?`<div class="res"><div class="box"><div class="big">${st.win==me?'🏆':st.win<0?'🤝':'😔'}</div><h2>${st.win==me?'Победа':st.win<0?'Ничья':'Поражение'}</h2><p style="margin:-6px 0 12px;opacity:.85">${RS[st.result.reason]||''}</p>${rr?`<div class="dl ${rr.d>=0?'up':'dn'}">${rr.d>=0?'+':''}${rr.d}</div><div style="margin:4px 0 14px;opacity:.9">Шахматный рейтинг ${rr.after} · ${rankOf(rr.after).n}</div>`:''}<div class="row"><button class="btn" onclick="send({t:'again'})">Реванш</button><button class="btn ghost" onclick="location.reload()">В меню</button></div></div></div>`:'';
  const pv=chPromo?`<div class="res" onclick="chPromo=null;draw()"><div class="box"><h2>Превращение пешки</h2><div class="row">${['q','r','b','n'].map(t=>`<button class="btn pcb" onclick="event.stopPropagation();send({t:'move',from:'${chPromo.from}',to:'${chPromo.to}',promo:'${t}'});chPromo=null;chSel=null">${gl(t)}</button>`).join('')}</div></div></div>`:'';
  a.innerHTML=`<div class="top"><div style="display:flex;gap:6px;align-items:center"><div class="chip"><b>${esc(st.room)}</b></div><button class="ico snd" onclick="toggleSound()">${muted?'🔇':'🔊'}</button><button class="ico rbtn ${st.radio&&!radioMuted?'on':''}" onclick="toggleRadio()">📻</button></div><div class="chip">♞ ${st.tc} мин</div></div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0">${chBar(opp)}<div class="board" style="margin:0 auto">${boardHTML()}</div>${chBar(me)}</div>
  <div class="msg">${dr||msg}</div><div class="mlist" id="ml">${ml.join('')}</div>
  <div class="bar"><button class="ico" onclick="chResign()">🏳</button><button class="ico" onclick="send({t:'draw'})">🤝</button><div style="flex:1"></div><button class="ico" onclick="toggleReact()">😊</button><button class="ico" onclick="toggleChat()">💬${unread>0?`<i>${unread}</i>`:''}</button></div>${ov}${pv}`;
  const m=$('#ml');if(m)m.scrollLeft=m.scrollWidth}

function blXY(e){const r=e.target.getBoundingClientRect(),L=blLay;return{x:(e.clientX-r.left-L.ox)/L.s,y:(e.clientY-r.top-L.oy)/L.s}}

function blMoveCue(w){const x=Math.max(BR,Math.min(BW-BR,w.x)),y=Math.max(BR,Math.min(BLL-BR,w.y));if(blCanPlace(x,y)){blCueOv={x,y};blInvalid=0}else blInvalid=1;blDirty=1}

const RANKS=[{n:'Новичок',min:0,c:['#a9b3ae','#5b6663'],g:'6'},{n:'Игрок',min:1000,c:['#eab27a','#8a4f27'],g:'♣'},{n:'Знаток',min:1150,c:['#eef3f7','#8794a0'],g:'♦'},{n:'Мастер',min:1300,c:['#ffe38f','#c98a12'],g:'♥'},{n:'Шулер',min:1500,c:['#9ff5e4','#168a80'],g:'♠'},{n:'Легенда',min:1800,c:['#ff9f90','#a81c28'],g:'♛'}];
const CH_RANKS=[{n:'Пешка',min:0,c:['#cbd5e1','#64748b'],g:'♟'},{n:'Конь',min:1000,c:['#9ed0ff','#2d6aa3'],g:'♞'},{n:'Слон',min:1150,c:['#a8f0ff','#168aa6'],g:'♝'},{n:'Ладья',min:1300,c:['#ffd88a','#b9770e'],g:'♜'},{n:'Ферзь',min:1500,c:['#e2b8ff','#7a3fb0'],g:'♛'},{n:'Король',min:1800,c:['#fff1b8','#d4af37'],g:'♚'}];
const MA_RANKS=[{n:'Прохожий',min:0,c:['#b9b8c4','#55546a'],g:'I'},{n:'Свидетель',min:1000,c:['#efc08e','#8a5430'],g:'II'},{n:'Детектив',min:1150,c:['#b6d3f2','#3d6fa5'],g:'III'},{n:'Капо',min:1300,c:['#ff9fae','#b3203a'],g:'IV'},{n:'Консильери',min:1500,c:['#e8c8ff','#7a3fb0'],g:'V'},{n:'Дон',min:1800,c:['#ffe69a','#b8860b'],g:'VI'}];
const RK_=()=>({chess:CH_RANKS,mafia:MA_RANKS,billiards:BL_RANKS})[chGame]||RANKS;
const rankIdx=r=>RK_().reduce((a,x,i)=>r>=x.min?i:a,0),rankOf=r=>RK_()[rankIdx(r)];
function badge(rt,s){const k=rankIdx(rt),R=RK_()[k],id=chGame[0]+'g'+k,SH=({chess:'M24 2 44 13v24L24 54 4 37V13z',mafia:'M2 27a22 22 0 1 0 44 0 22 22 0 1 0-44 0z',billiards:'M2 27a22 22 0 1 0 44 0 22 22 0 1 0-44 0z'})[chGame]||'M24 2 44 10v18c0 14-10 23-20 27C14 51 4 42 4 28V10z',HL=chGame=='mafia'||chGame=='billiards'?'M6 27a18 18 0 1 0 36 0 18 18 0 1 0-36 0z':'M24 7 39 13v15c0 10-7 17-15 21';
  return `<svg width="${s}" height="${Math.round(s*1.17)}" viewBox="0 0 48 56"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${R.c[0]}"/><stop offset="1" stop-color="${R.c[1]}"/></linearGradient></defs><path d="${SH}" fill="url(#${id})" stroke="#fff" stroke-opacity=".75" stroke-width="2"/><path d="${HL}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>${chGame=='billiards'?'<circle cx="24" cy="27" r="11.5" fill="#fff"/>':''}<text x="24" y="33" text-anchor="middle" font-size="${chGame=='billiards'?19:22}" font-weight="900" font-family="Playfair Display,Georgia,serif" fill="${k==5&&chGame!='chess'&&chGame!='billiards'?'#fff':'#10141c'}" fill-opacity=".88">${R.g}${chGame=='chess'?'&#xFE0E;':''}</text>${[...Array(k)].map((_,i)=>`<circle cx="${24-(k-1)*4+i*8}" cy="45" r="2" fill="#fff" fill-opacity=".9"/>`).join('')}</svg>`}
function profCard(name,pr){const k=rankIdx(pr.rating),R=RK_()[k],nx=RK_()[k+1];
  const pct=nx?Math.round((pr.rating-R.min)/(nx.min-R.min)*100):100,wr=pr.games?Math.round(pr.wins/pr.games*100):0,days=Math.max(1,Math.ceil((Date.now()-pr.since)/864e5));
  return `<div class="pc"><div class="badge-big">${badge(pr.rating,86)}</div><h3>${esc(name)}</h3><div style="opacity:.9">${R.n} · ${pr.rating}</div><div class="bar2"><i style="width:${pct}%"></i></div><div style="font-size:12px;opacity:.7">${nx?`До ранга «${nx.n}»: ${nx.min-pr.rating}`:'Высший ранг'}</div><div class="grid"><div><b>${pr.games}</b>партий</div><div><b>${wr}%</b>побед</div>${pr.draws!==undefined?`<div><b>${pr.draws}</b>ничьих</div>`:`<div><b>${pr.streak}</b>серия</div>`}</div><p style="font-size:12px;opacity:.7;margin:12px 0 0">Играет с ${new Date(pr.since).toLocaleDateString('ru',{month:'long',year:'numeric'})} (${days} дн.)</p></div>`}
function showProf(j){const p=st.players[j],pm=$('#pm');
  pm.innerHTML=p.prof?profCard(p.name,p.prof):`<div class="pc"><h3>${esc(p.name)}</h3><p style="opacity:.8">${p.bot?'У ботов нет рейтинга':'Гость: рейтинг ведется для игроков из Telegram'}</p></div>`;pm.hidden=false}
let me0;
async function loadMe(){try{const d=tg&&tg.initData;if(!d)return;const p=await (await fetch('/api/me?g='+chGame+'&d='+encodeURIComponent(d))).json();if(!p||!$('#me'))return;me0=p;
  $('#me').innerHTML=`<div class="seat me" onclick="meCard()" style="margin:6px auto;width:max-content">${av({name:p.name,photo:p.photo,n:'',prof:p})}<div><div class="nm">${esc(p.name)}</div><div class="rt">${rankOf(p.rating).n} · ${p.rating}</div></div></div>`}catch(e){}}
function meCard(){$('#pm').innerHTML=profCard(me0.name,me0);$('#pm').hidden=false}
async function showTop(g){g=chGame;let l=[];try{l=await (await fetch('/api/top?g='+g)).json()}catch(e){}
  $('#pm').innerHTML=`<div class="pc" onclick="event.stopPropagation()"><h3>Лучшие игроки: ${({durak:'дурак',chess:'шахматы',mafia:'мафия',billiards:'бильярд'})[g]}</h3><div class="top10">${l.length?l.map((u,i)=>`<div class="r"><b class="pos">${i+1}</b>${badge(u.rating,22)}<span>${esc(u.name)}</span><b>${u.rating}</b></div>`).join(''):'<p style="text-align:center;opacity:.7">Пока никто не сыграл</p>'}</div></div>`;$('#pm').hidden=false}
function resHTML(me){const r=(st.result||[]).find(x=>x.i==me);
  if(!r)return st.players[me].prof?'':'<p style="opacity:.7;font-size:13px;margin:0 0 14px">Рейтинг ведется для игроков из Telegram</p>';
  const a=rankIdx(r.before),b=rankIdx(r.after);
  return `<div class="dl ${r.d>=0?'up':'dn'}">${r.d>=0?'+':''}${r.d}</div><div style="margin:4px 0 16px;opacity:.92">Рейтинг ${r.after} · ${RK_()[b].n}${b>a?'<br>🎉 Новый ранг!':b<a?'<br>Ранг понижен':''}</div>`}

const face=(c,cls,attrs,tr)=>`<div class="card ${c.s==1||c.s==2?'red':''} ${tr?'t':''} ${cls}" ${attrs||''}><i>${RK[c.r-6]}<br>${SU[c.s]}</i><b>${SU[c.s]}</b><i class="br">${RK[c.r-6]}<br>${SU[c.s]}</i></div>`;
function card(c,cls,id,attrs){const nw=!seen.has(id);next.add(id);return face(c,cls+(nw?' in':''),attrs,st.tc&&c.s==st.tc.s)}
const av=p=>`<div class="av" style="background-color:hsl(${hue(p.name)} 45% 36%);${p.photo?`background-image:url('${esc(p.photo)}')`:''}">${p.photo?'':esc([...p.name][0]||'?').toUpperCase()}${p.n===''?'':`<span class="cnt">${p.n}</span>`}${p.prof?`<span class="bg">${badge(p.prof.rating,22)}</span>`:''}</div>`;
const seat=(p,j,me)=>`<div class="seat ${me?'me':''} ${p.left?'left':p.off?'gone':''} ${j==st.att?'att':''} ${j==st.def?'def':''}" id="seat-${j}" onclick="showProf(${j})">${av(p)}<div><div class="nm">${esc(p.name)}${me?' (вы)':''}</div><div class="role">${p.left?'🚪 покинул игру':p.off?`📵 нет связи <span class="offt" data-e="${Date.now()+p.offIn}">${Math.ceil(p.offIn/1000)}</span> с`:p.n==0&&!st.deck?'✅ без карт':j==st.att?'⚔️ ходит':j==st.def?'🛡 отбивается':p.bot?'🤖 бот':'&nbsp;'}</div>${p.prof?`<div class="rt">${rankOf(p.prof.rating).n} · ${p.prof.rating}</div>`:''}</div></div>`;

function entry(){
  const code=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';
  $('#app').innerHTML=`${sndBtn()}${chGame=='chess'?`<div class="hero" style="align-items:center;gap:6px">${['♞','♛','♚'].map((g,i)=>`<span class="pz ${i==1?'b':'w'}" style="position:static;display:block;width:auto;font-size:${i==1?84:68}px;animation:fan 1s ${i*.1}s cubic-bezier(.2,1.2,.3,1) backwards">${g}&#xFE0E;</span>`).join('')}</div>`:chGame=='billiards'?`<div class="hero" style="align-items:center;gap:14px">${[[1,'#f4c20d'],[8,'#1a1a1a'],[3,'#d62d20']].map(([n,c],i)=>`<span class="hb" style="--c:${c};animation:fan 1s ${i*.12}s cubic-bezier(.2,1.2,.3,1) backwards"><b>${n}</b></span>`).join('')}</div>`:chGame=='mafia'?`<div class="hero" style="align-items:center;gap:18px">${['🎩','🕵️','🔪'].map((g,i)=>`<span style="font-size:${i==1?76:58}px;animation:fan 1s ${i*.12}s cubic-bezier(.2,1.2,.3,1) backwards;filter:drop-shadow(0 6px 14px #000a)">${g}</span>`).join('')}</div>`:`<div class="hero">${face({r:14,s:0},'')}${face({r:14,s:1},'')}${face({r:13,s:2},'')}</div>`}
  <h1>${GT[chGame][0]}</h1><p class="sub">${GT[chGame][1]}</p><div id="me"></div>
  <form onsubmit="return go(event)"><input id="nm" maxlength="12" placeholder="Ваше имя" value="${esc(U?U.first_name:'')}">
  <input id="rm" maxlength="8" placeholder="Код комнаты" value="${esc(code)}">
  <div class="row"><button class="btn" type="submit">Войти</button><button class="btn ghost" type="button" onclick="$('#rm').value=Math.random().toString(36).slice(2,6);go()">Новая комната</button></div></form><div class="row" style="margin-top:6px"><button class="btn ghost" onclick="showTop()">🏆 Лучшие игроки</button></div>`;
  loadMe();
}
function go(e){if(e)e.preventDefault();const room=$('#rm').value.trim();if(!room){alert('Введите код комнаты');return false}
  cur={room,name:$('#nm').value.trim()||'Игрок',game:chGame};conn();return false}
function conn(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{$('#net').hidden=true;send({t:'join',room:cur.room,name:cur.name,game:cur.game,uid,initData:(tg&&tg.initData)||''})};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.err){alert(m.err);cur=null;ws.close();return}
    if(m.ev=='stations'){stations=m.list.filter(x=>x.url);return}if(m.ev=='react')return float(m);
    if(m.ev=='shot')return blOnShot(m);if(m.ev=='afk')return afkEv(m);chAt=Date.now();selT=null;st=m;idleAt=st.idle?Date.now()-st.idle.ms:0;draw();chatRender();syncRadio();if(radioOpen)renderRadio()};
  ws.onclose=()=>{if(cur){$('#net').hidden=false;setTimeout(conn,1500)}};
}
function lobby(a){
  a.innerHTML=`${sndBtn()}<h1 style="font-size:40px;margin-top:20px">Комната ${esc(st.room)}</h1><p class="sub">Позовите друзей: пустые места займут боты.</p>
  <div class="lob">${st.players.map((p,j)=>`<div class="seat" onclick="showProf(${j})" style="animation:pop .4s ${j*.07}s backwards">${av({...p,n:''})}<div class="nm">${esc(p.name)}</div>${p.prof?`<div class="rt">${rankOf(p.prof.rating).n} · ${p.prof.rating}</div>`:`<div class="role">${p.bot?'🤖 бот':'&nbsp;'}</div>`}</div>`).join('')}</div>
  <div style="flex:1"></div>
  <div class="row"><button class="btn ghost" onclick="share()">Пригласить</button><button class="btn ghost" onclick="toggleRadio()">📻 Радио</button><button class="btn ghost" onclick="send({t:'bot'})" ${st.players.length>=6?'disabled':''}>+ Бот</button><button class="btn" onclick="send({t:'start'})" ${st.players.length<2?'disabled':''}>Начать</button></div>`;
}
function share(){const l='https://t.me/share/url?url='+encodeURIComponent(INVITES[chGame]+'?startapp='+st.room)+'&text='+encodeURIComponent(({durak:'Сыграем в дурака?',chess:'Сыграем в шахматы?',mafia:'Сыграем в мафию?',billiards:'Сыграем в бильярд?'})[chGame]+' Код комнаты: '+st.room);tg&&tg.openTelegramLink?tg.openTelegramLink(l):window.open(l,'_blank')}
function play(k){if(st.over)return;send({t:'play',i:k,to:selT});selT=null;hap('light')}
function draw(){
  const a=$('#app');next=new Set();
  if(st.game=='chess'){drawChess(a);return}
  if(st.game=='mafia'){drawMafia(a);return}
  if(st.game=='billiards'){drawBill(a);return}
  if(!st.started){lobby(a);seen=next;prevSt=st;return}
  const me=st.you,T=st.tc.s,hasOpen=st.table.some(t=>!t.d),defN=st.players[st.def].n,unb=st.table.filter(t=>!t.d).length;
  const ranks=new Set(st.table.flatMap(t=>[t.a.r,t.d&&t.d.r].filter(Boolean)));
  const can=c=>{if(st.over)return true;
    if(me==st.def)return st.table.some((t,j)=>!t.d&&(selT==null||selT==j)&&(c.s==t.a.s?c.r>t.a.r:c.s==T));
    if(!st.table.length)return me==st.att;
    return st.table.length<6&&unb<defN&&ranks.has(c.r)};
  let msg=me==st.def?(hasOpen?'Отбейте карту или возьмите':'Всё отбито, ждем «Бито»'):me==st.att?(st.table.length?(hasOpen?'Соперник отбивается…':'Подкиньте карту или нажмите «Бито»'):'Ваш ход'):'Можно подкинуть карту того же достоинства';
  const offs=st.players.filter(p=>p.off&&!p.left);if(offs.length&&!st.over)msg='⏳ Ждем игрока: '+offs.map(p=>esc(p.name)).join(', ');
  const ia=st.idle;if(ia&&!st.over&&!offs.length){const el=Date.now()-idleAt;
    if(el>=ia.warn){if(ia.i==me){const end=el<ia.fine?ia.fine:ia.kick;msg=`⚠️ Ваш ход! ${el<ia.fine?'До снятия рейтинга':'До исключения'}: <span class="offt" data-e="${Date.now()+end-el}">${Math.ceil((end-el)/1000)}</span> с`}
      else msg='⏳ '+esc(st.players[ia.i].name)+' долго думает'}}
  const b=[];
  if(!st.over&&me==st.def&&hasOpen)b.push(`<button class="btn" onclick="send({t:'take'})">Взять</button>`);
  if(!st.over&&me!=st.def&&st.table.length&&!hasOpen)b.push(`<button class="btn" onclick="send({t:'done'})">Бито</button>`);
  const unread=chatOpen?0:st.logN-logSeen;
  const win=st.loser!=me,txt=st.loser<0?'Ничья':st.loser==me?'Вы остались дураком':'Дурак: '+esc(st.players[st.loser].name);
  a.innerHTML=`<div class="top"><div style="display:flex;gap:6px;align-items:center"><div class="chip"><b>${esc(st.room)}</b></div><button class="ico snd" onclick="toggleSound()">${muted?'🔇':'🔊'}</button><button class="ico rbtn ${st.radio&&!radioMuted?'on':''}" onclick="toggleRadio()">📻</button></div><div class="deckbox"><span class="n">Колода ${st.deck}</span>${card(st.tc,'sm','trump')}</div></div>
  <div class="seats">${st.players.map((p,j)=>j==me?'':seat(p,j)).join('')}</div>
  <div class="felt">${st.table.length?st.table.map((t,j)=>`<div class="pair">${card(t.a,'a'+(selT===j?' sel':''),'a'+key(t.a),me==st.def&&!t.d?`onclick="selT=${j};draw()"`:'')}${t.d?card(t.d,'d','d'+key(t.d)):''}</div>`).join(''):'<div class="empty">Стол пуст</div>'}</div>
  <div class="msg">${msg}</div>
  <div class="bar">${seat(st.players[me],me,1)}<div class="btns">${b.join('')}</div><div class="tools"><button class="ico" onclick="toggleReact()">😊</button><button class="ico" onclick="toggleChat()">💬${unread>0?`<i>${unread}</i>`:''}</button></div></div>
  <div class="hand" style="--n:${Math.max(st.hand.length,2)}">${st.hand.map((c,k)=>card(c,'h'+(can(c)?'':' dim'),'h'+key(c),`style="--i:${k}" onclick="play(${k})"`)).join('')}</div>
  ${st.players[me].left?`<div class="res"><div class="box"><div class="big">🚪</div><h2>Вы больше не в партии</h2><button class="btn" onclick="location.reload()">В меню</button></div></div>`:''}${st.over?`<div class="res"><div class="box"><div class="big">${win?'🏆':'🤡'}</div><h2>${txt}</h2>${resHTML(me)}<button class="btn" onclick="send({t:'again'})">Сыграть ещё раз</button></div></div>`:''}`;
  sfx(seen,next,me,win);seen=next;prevSt=st;
  if(st.over)try{tg.HapticFeedback.notificationOccurred(win?'success':'error')}catch(e){}
}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,5000)}
function afkEv(m){
  if(m.stage=='warn'){toast('⏳ Ваш ход! Через 30 с будет снят рейтинг');snd('warn');try{tg.HapticFeedback.notificationOccurred('warning')}catch(e){}}
  else if(m.stage=='fine'){toast(m.d?'⚠️ '+m.d+' к рейтингу за бездействие':'⚠️ Вы все еще не ходите');snd('warn');try{tg.HapticFeedback.notificationOccurred('error')}catch(e){}}
  else toast('🚪 Вы исключены из игры за бездействие')}
function float(m){snd('pop');const el=$('#seat-'+m.from),r=el?el.getBoundingClientRect():{left:innerWidth/2-20,top:innerHeight-170,width:40};
  const s=document.createElement('span');s.className='fl';s.textContent=m.e;s.style.left=r.left+r.width/2-18+'px';s.style.top=r.top+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1950)}
$('#react').innerHTML=EMO.map(e=>`<button onclick="send({t:'react',e:'${e}'});toggleReact()">${e}</button>`).join('');
function toggleReact(){const r=$('#react');r.hidden=!r.hidden}
function toggleChat(){chatOpen=!chatOpen;if(chatOpen&&radioOpen)toggleRadio();$('#sheet').classList.toggle('open',chatOpen);$('#bd').hidden=!(chatOpen||radioOpen);if(!chatOpen)$('#ci').blur();if(chatOpen)$('#react').hidden=true;if(st){logSeen=st.logN;chatRender();draw()}}
function say(t){const i=$('#ci');const text=(t||i.value).trim();if(!text)return;send({t:'chat',text});i.value=''}
function chatRender(){if(!st)return;setChatUI();const l=$('#log');
  if(prevLogN!==null&&st.logN>prevLogN){const lm=st.log[st.log.length-1];if(lm&&lm.n>=0&&lm.n!=st.you)snd('msg')}prevLogN=st.logN;
  l.innerHTML=st.log.map(m=>m.n<0?`<div class="m sys ${m.ch=='p'?'priv':''}">${esc(m.text)}</div>`:`<div class="m ${m.n==st.you?'me':''} ${m.ch=='mafia'?'mafiach':m.ch=='dead'?'deadch':''}"><small>${m.ch=='mafia'?'🔪 ':m.ch=='dead'?'👻 ':''}${esc(m.name)}</small>${esc(m.text)}</div>`).join('');
  l.scrollTop=l.scrollHeight;if(chatOpen)logSeen=st.logN}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheets()});
setInterval(()=>document.querySelectorAll('.offt').forEach(e=>e.textContent=Math.max(0,Math.ceil((+e.dataset.e-Date.now())/1000))),500);
setInterval(()=>{if(!st||st.game!='chess'||!st.clk)return;document.querySelectorAll('.clk').forEach(e=>{const c=e.dataset.s,ms=clkNow(c);e.textContent=fmtT(ms);e.classList.toggle('low',ms<30000&&st.clk.run&&st.clk.turn==c)})},250);
entry();
</script>
</body>
</html>
