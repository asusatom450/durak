/* ===== тема бильярда: тёплый клуб, орех и латунь, синее сукно ===== */
body.billiards{--gold:#f0b441;color:#f6ead7;background:radial-gradient(ellipse 70% 40% at 50% 6%,#ffcf7a55,transparent 70%),radial-gradient(ellipse at 50% 115%,#000d,transparent 55%),repeating-linear-gradient(90deg,#3a2010 0 7px,#432612 7px 14px),linear-gradient(#2b170a,#120804)}
.billiards h1{font:400 36px/1.05 'Russo One','Manrope',sans-serif;color:#ffe6b8;text-shadow:0 0 26px #f0b44199,0 3px 0 #0008;letter-spacing:1.5px;text-transform:uppercase}
.billiards .sub{opacity:.78}
.billiards .btn{border-radius:12px;background:linear-gradient(#ffd27a,#d9962a);color:#2b1704;box-shadow:0 3px 0 #8a5a10,0 8px 18px #0007;font-family:'Russo One','Manrope',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.5px}
.billiards .btn:active{box-shadow:0 1px 0 #8a5a10}
.billiards .btn.ghost{background:#ffffff14;color:#f6ead7;box-shadow:none;border:1px solid #ffffff30}
.billiards input{border-radius:12px;background:#1a0d05cc;color:#f6ead7}
.billiards .chip,.billiards .ico,.billiards .seat{background:#1a0d05bb;border-color:#ffffff22}
.billiards .chip b,.billiards .rt,.billiards .pos{color:#ffcf7a}
.billiards .res .box,.billiards .pc{background:linear-gradient(#3a200e,#160a04);border-color:#f0b441aa;border-radius:14px}
.billiards .sheet{background:#150a04f5}
.billiards .res h2,.billiards .pc h3{font:400 22px 'Russo One','Manrope',sans-serif;text-transform:uppercase}
.billiards .stb.on{border-color:#f0b441;background:#f0b44122}.billiards .eq b{background:#f0b441}.billiards .rbtn.on{box-shadow:0 0 0 2px #f0b441}
.billiards #toast{border-color:#f0b441}.billiards .bar2 i{background:linear-gradient(90deg,#d9962a,#ffd88f)}.billiards .m.me{background:#f0b441;color:#2b1704}
.hb{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fffa 0,#fff0 34%),var(--c);box-shadow:inset -7px -9px 16px #000a,0 12px 22px #000b;display:grid;place-items:center}
.hb b{width:34px;height:34px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:800 19px Manrope}
.billiards #app{padding-left:4px;padding-right:4px;gap:6px}
.billiards #app>.top,.billiards #app>.blbar,.billiards #app>.blmsg,.billiards #app>.blctl{padding-left:6px;padding-right:6px}
.blbar{display:flex;align-items:center;gap:6px}
.blbar>div:first-child,.blbar>div:last-child{flex:1;min-width:0}
.blmid{width:56px;text-align:center}
.billiards .mft{font:400 16px 'Russo One',sans-serif;color:#ffcf7a}
.blp{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:12px;background:linear-gradient(#3a1f0d,#1d0e05);border:1px solid #c9953a55;box-shadow:inset 0 1px 0 #ffffff12,0 4px 12px #0006;transition:.3s}
.blp.act{border-color:#f0b441;box-shadow:inset 0 1px 0 #ffffff1c,0 0 0 1px #f0b44166,0 0 18px #f0b44166}
.blp .av{width:34px;height:34px;flex:none}.blp .bli{min-width:0}.blp .nm{font-size:12px;max-width:100%}
.blm{display:flex;align-items:center;min-height:13px}.blopen{font-size:10.5px;opacity:.7}
.mb{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:2px;background:radial-gradient(circle at 35% 30%,#fffc 0 12%,#fff0 45%),var(--c);box-shadow:inset -1px -2px 3px #0008}
.mb.st{background:radial-gradient(circle at 35% 30%,#fffc 0 12%,#fff0 45%),linear-gradient(#f6f3ea 0 28%,var(--c) 28% 72%,#f6f3ea 72%)}.mb.out{opacity:.16}
.blwrap{flex:1;min-height:0;position:relative}
.blwrap canvas{position:absolute;inset:0;touch-action:none;display:block}
.blmsg{text-align:center;font-size:13px;min-height:30px;display:flex;flex-direction:column;justify-content:center}
.blres{color:#ffd88f;font-weight:700}
.blring{position:relative;width:46px;height:46px;margin:0 auto}.blring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.blring circle{fill:none;stroke-width:3.5;stroke:#ffffff1c}.blring #blrg{stroke:#f0b441;stroke-dasharray:100;stroke-linecap:round;filter:drop-shadow(0 0 3px #f0b44199);transition:stroke .3s}
.blring.low #blrg{stroke:#e8553b;filter:drop-shadow(0 0 3px #e8553b)}.blring .mft{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.bl3d{position:absolute;top:8px;right:8px;z-index:4;height:30px;padding:0 12px;border-radius:15px;border:1px solid #f0b44199;background:#1a0d05d9;color:#ffd88f;font:400 12px 'Russo One',Manrope,sans-serif;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 12px #0008}
.bl3d.on{background:linear-gradient(#ffd27a,#d9962a);color:#2b1704}
.blann{position:absolute;inset:0;display:grid;place-items:start center;padding-top:12%;pointer-events:none;z-index:3}
.blann .pl{position:relative;min-width:190px;max-width:86%;padding:12px 28px 13px;border-radius:10px;text-align:center;background:linear-gradient(#fbe3a6,#dca646 44%,#a9741c 56%,#e6b85c);box-shadow:inset 0 1px 0 #fff9,inset 0 -2px 0 #0004,0 0 0 2px #5a3510,0 0 0 4px #c9953a,0 16px 32px #000c,0 0 44px #f0b44166;animation:blpl 2s cubic-bezier(.2,1.2,.3,1) forwards;transform-origin:50% -60px}
.blann .pl::before,.blann .pl::after{content:'';position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8,#7a4a12 70%)}
.blann .pl::before{left:9px}.blann .pl::after{right:9px}
.blann .t{font:400 30px/1 'Russo One',Manrope,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#3b2306;text-shadow:0 1px 0 #ffeec4,0 -1px 0 #7a4c14}
.blann .s{font:800 11.5px Manrope,sans-serif;color:#4a2c0a;margin-top:6px;letter-spacing:.4px;text-transform:uppercase}
.blann .pl.red{background:linear-gradient(#ffc2b0,#d9573c 44%,#a3301a 56%,#e57356);box-shadow:inset 0 1px 0 #fff9,inset 0 -2px 0 #0004,0 0 0 2px #4a1208,0 0 0 4px #c9953a,0 16px 32px #000c,0 0 44px #e8553b66}
.blann .pl.red .t{color:#2e0703;text-shadow:0 1px 0 #ffd4c8}.blann .pl.red .s{color:#3a0b05}
.blann .pl.dark{background:linear-gradient(#3a3a3a,#111 50%,#000 56%,#2a2a2a)}.blann .pl.dark .t{color:#ffd88f;text-shadow:0 0 12px #f0b44188}.blann .pl.dark .s{color:#f6ead7}
.blann .pl.info{background:linear-gradient(#f3e6c8,#cdb17a 44%,#a08550 56%,#d8c193)}
@keyframes blpl{0%{transform:translateY(-140%) rotate(-9deg);opacity:0}14%{transform:translateY(0) rotate(5deg);opacity:1}24%{transform:rotate(-3deg)}34%{transform:rotate(1.4deg)}42%,82%{transform:none;opacity:1}100%{transform:translateY(-30%);opacity:0}}
.blctl{display:flex;gap:8px;align-items:center;min-height:48px}
.blctl input[type=range]{flex:1;min-width:0;padding:0;height:30px;background:none;border:0;-webkit-appearance:none;appearance:none}
.blctl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#3a6fd0 0 2%,#f6f0e2 2% 8%,#ead09a 8%,#c58a46 55%,#e2bd62 57% 59%,#2c1408 60%,#5c2611 85%,#140701);box-shadow:inset 0 1px 2px #0008}
.blctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#d9a441 55%,#7a4a12);box-shadow:0 2px 6px #000a}
.blctl input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#3a6fd0 0 2%,#f6f0e2 2% 8%,#ead09a 8%,#c58a46 55%,#e2bd62 57% 59%,#2c1408 60%,#5c2611 85%,#140701)}
.blctl input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#d9a441 55%,#7a4a12);box-shadow:0 2px 6px #000a}
/* ===== тема боулинга: ночной клуб, неон, табло-монитор над дорожкой ===== */
body.bowling{--gold:#3ee6ff;color:#eef0ff;background:radial-gradient(ellipse 80% 45% at 50% -5%,#7b3cff66,transparent 70%),radial-gradient(ellipse 60% 40% at 100% 100%,#ff4fb02e,transparent 70%),radial-gradient(ellipse 60% 40% at 0% 92%,#20d3ff24,transparent 70%),linear-gradient(#120b30,#06040f)}
.bowling h1{font:900 italic 46px/1.05 'Exo 2','Manrope',sans-serif;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(90deg,#3ee6ff,#a78bfa 50%,#ff4fb0);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 16px #7b3cff99)}
.bowling .sub{opacity:.78}
.bowling .btn{border-radius:12px;background:linear-gradient(135deg,#ff4fb0,#8b5cf6);color:#fff;box-shadow:inset 0 0 0 1px #ffffff2a,0 6px 22px #ff4fb050;font:800 14px 'Exo 2','Manrope',sans-serif;text-transform:uppercase;letter-spacing:.6px}
.bowling .btn:active{box-shadow:inset 0 0 0 1px #ffffff2a,0 2px 10px #ff4fb050}
.bowling .btn.ghost{background:#ffffff0c;color:#dff8ff;box-shadow:inset 0 0 0 1px #3ee6ff55}
.bowling input{border-radius:12px;background:#0b0820cc;border-color:#3ee6ff33;color:#eef0ff}
.bowling .chip,.bowling .ico,.bowling .seat{background:#0d0a26cc;border-color:#ffffff1f}
.bowling .chip b,.bowling .rt,.bowling .pos{color:#3ee6ff}
.bowling .res .box,.bowling .pc{background:linear-gradient(#1b1342,#0a0720);border-color:#3ee6ff88;border-radius:18px;box-shadow:0 0 44px #7b3cff55}
.bowling .res h2,.bowling .pc h3{font:900 italic 24px 'Exo 2','Manrope',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.bowling .sheet{background:#0b0820f5}
.bowling .stb.on{border-color:#3ee6ff;background:#3ee6ff22}.bowling .eq b{background:#3ee6ff}.bowling .rbtn.on{box-shadow:0 0 0 2px #3ee6ff}
.bowling #toast{border-color:#ff4fb0}.bowling .bar2 i{background:linear-gradient(90deg,#3ee6ff,#ff4fb0)}.bowling .m.me{background:#8b5cf6;color:#fff}
.bowling #app{padding-left:6px;padding-right:6px;gap:6px}
.bowling .mft{font:800 11px 'JetBrains Mono',monospace;color:#fff}
/* табло: монитор в рамке, стекло и строчная развёртка */
.bwmon{position:relative;flex:none;border-radius:14px;padding:5px;background:linear-gradient(#262838,#0b0c14);box-shadow:0 0 0 1px #ffffff1c,0 0 0 4px #04050a,0 12px 28px #000b,0 0 34px #3ee6ff26}
.bwmon::after{content:'';position:absolute;inset:5px;border-radius:10px;pointer-events:none;background:linear-gradient(165deg,#ffffff17,#fff0 38%),repeating-linear-gradient(0deg,#0000 0 2px,#0000002e 2px 3px)}
.bwscr{border-radius:10px;background:radial-gradient(ellipse 120% 90% at 50% 0%,#173a7e,#0a1a44 55%,#060e28);padding:4px 4px 5px;overflow:hidden}
.bwhd{display:flex;align-items:center;gap:8px;font:800 10px/1 'Exo 2',Manrope,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#8fc8ff;margin:1px 2px 4px;white-space:nowrap}
.bwhd b{color:#fff;font-weight:900}.bwhd .sp{flex:1}.bwhd .v{color:#ffd166}
.bwg{display:grid;grid-template-columns:minmax(48px,2.4fr) repeat(9,minmax(0,1fr)) minmax(0,1.45fr) minmax(0,1.3fr);gap:2px}
.bwrow{display:contents}
.bwg .h{font:800 9px/12px 'Exo 2',Manrope,sans-serif;color:#7fb0ff;text-align:center}
.bwn{display:flex;align-items:center;min-width:0;height:31px;font:800 10.5px Manrope;padding:0 3px 0 5px;border-radius:5px;background:#ffffff0d;color:#e9f3ff;cursor:pointer;box-shadow:inset 3px 0 0 var(--c)}
.bwn i{display:none}
.bwn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bwf{height:31px;border-radius:4px;background:#0b1c48;box-shadow:inset 0 0 0 1px #2d58a855;display:flex;flex-direction:column;min-width:0;transition:background .3s}
.bwf .rb{display:flex;justify-content:flex-end;height:13px}
.bwf .rb i{font:800 9.5px/13px 'JetBrains Mono',monospace;font-style:normal;flex:0 1 12px;min-width:0;text-align:center;color:#d7e9ff}
.bwf .rb i+i{box-shadow:inset 1px -1px 0 #2d58a8}
.bwf .rb i.x{color:#ff5fbf;text-shadow:0 0 6px #ff4fb0}.bwf .rb i.sl{color:#5ff0ff;text-shadow:0 0 6px #3ee6ff}.bwf .rb i.f{color:#ff7a7a}
.bwf .rb i.spl{border-radius:50%;box-shadow:inset 0 0 0 1px #ffd166;color:#ffd166}
.bwf b{flex:1;display:grid;place-items:center;font:800 11px 'JetBrains Mono',monospace;color:#fff;letter-spacing:-.5px}
.bwf.cur{background:#123a7a;box-shadow:inset 0 0 0 1.5px #3ee6ff,0 0 10px #3ee6ff77;animation:bwbl 1s ease-in-out infinite alternate}
.bwf.new b{animation:bwnew .9s ease-out}
.bwt{height:31px;border-radius:4px;display:grid;place-items:center;font:900 13px 'JetBrains Mono',monospace;color:#ffd166;background:#0b1c48;box-shadow:inset 0 0 0 1px #ffd16655}
.bwrow.act .bwn{background:linear-gradient(90deg,#3ee6ff55,#3ee6ff12);box-shadow:inset 0 0 0 1px #3ee6ff99}
.bwrow.gone .bwn,.bwrow.gone .bwf,.bwrow.gone .bwt{opacity:.4}
@keyframes bwbl{to{box-shadow:inset 0 0 0 1.5px #3ee6ff,0 0 3px #3ee6ff33}}
@keyframes bwnew{0%{transform:scale(1.8);color:#ffd166;text-shadow:0 0 12px #ffd166}}
/* мини-схема кеглей на табло */
.bwpi{display:inline-flex;flex-direction:column;align-items:center;gap:1.5px;vertical-align:middle}
.bwpi div{display:flex;gap:2.5px}.bwpi i{width:5px;height:5px;border-radius:50%;background:#ffffff26}
.bwpi i.on{background:#fff;box-shadow:0 0 4px #9fe7ff}
.bwwrap{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px #ffffff14,0 10px 26px #0008;background:#07050f}
.bwwrap canvas{position:absolute;inset:0;touch-action:none;display:block}
.bwmsg{text-align:center;font-size:13px;min-height:32px;display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.bwmsg small{opacity:.62;font-size:11.5px}
.bwctl{display:flex;gap:8px;align-items:center;min-height:52px}
.bwspin{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;align-items:stretch}
.bwspin input{padding:0;height:24px;accent-color:#3ee6ff;background:none;border:0}
.bwspin small{font:700 11px Manrope;text-align:center;opacity:.85;white-space:nowrap}
.bwgo{position:relative;overflow:hidden;flex:none;width:132px;height:50px;border:0;border-radius:14px;background:#1a1240;color:#fff;font:900 italic 16px 'Exo 2',Manrope,sans-serif;letter-spacing:1px;text-transform:uppercase;box-shadow:inset 0 0 0 1.5px #ff4fb0,0 0 18px #ff4fb055;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.bwgo i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3ee6ff,#8b5cf6 60%,#ff4fb0)}
.bwgo span{position:relative;display:block;line-height:1.05;text-shadow:0 1px 3px #0009}.bwgo small{display:block;font:800 10px 'JetBrains Mono',monospace;letter-spacing:0;opacity:.9}
.bwbb{flex:none;width:50px;height:50px;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 4px 8px #000a)}
.bwbb img,.bwrk img{width:100%;height:100%;display:block}
.bwrack{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none;justify-content:center;flex-wrap:wrap}
.bwrk{display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;padding:6px 4px;border-radius:14px;border:1px solid #ffffff1f;background:#0d0a26aa;color:inherit;cursor:pointer;font:700 11px Manrope}
.bwrk img{width:48px;height:48px;filter:drop-shadow(0 4px 7px #000b)}.bwrk small{opacity:.65;font-size:10px}
.bwrk.on{border-color:#3ee6ff;box-shadow:0 0 0 1px #3ee6ff,0 0 16px #3ee6ff55;background:#3ee6ff18}
.bwann{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3;overflow:hidden}
.bwann .ry{position:absolute;left:50%;top:50%;width:180%;aspect-ratio:1;margin:-90% 0 0 -90%;background:repeating-conic-gradient(var(--a) 0 5deg,#0000 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,#0000 52%);mask:radial-gradient(circle,#000 0,#0000 52%);opacity:0;animation:bwry 1.7s ease-out forwards}
.bwann .in{position:relative;text-align:center;animation:bwin 1.7s cubic-bezier(.2,1.1,.3,1) forwards}
.bwann .t{font:900 italic clamp(38px,12.5vw,66px)/1 'Exo 2',Manrope,sans-serif;letter-spacing:1px;color:#fff;text-transform:uppercase;text-shadow:0 0 8px var(--a),0 0 26px var(--a),0 0 56px var(--a),0 3px 0 #0008;transform:skewX(-8deg)}
.bwann .s{font:900 13px 'Exo 2',Manrope,sans-serif;letter-spacing:3px;color:#fff;margin-top:10px;text-transform:uppercase;text-shadow:0 0 2px #000,0 0 10px var(--a),0 0 18px var(--a)}
.bwann .bwpi{margin-top:10px;gap:3px}.bwann .bwpi div{gap:5px}.bwann .bwpi i{width:9px;height:9px}
@keyframes bwin{0%{transform:scale(2.3);opacity:0;filter:blur(6px)}13%{transform:scale(.93);opacity:1;filter:none}21%{transform:scale(1.04)}29%,80%{transform:none;opacity:1}100%{transform:scale(1.12);opacity:0}}
@keyframes bwry{0%{opacity:0;transform:rotate(0)}18%{opacity:.32}100%{opacity:0;transform:rotate(70deg)}}
.bwfin{display:flex;flex-direction:column;gap:6px;margin:2px 0 12px;min-width:230px}
.bwfin .r{display:flex;align-items:center;gap:10px;background:#ffffff0d;border-radius:12px;padding:7px 12px;text-align:left}
.bwfin .r.me{box-shadow:inset 0 0 0 1px #3ee6ff88}.bwfin .r span{flex:1}.bwfin .r b{font:900 18px 'JetBrains Mono',monospace;color:#ffd166}.bwfin .r i{font-style:normal;width:22px}
.bwlob{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px;margin:0 auto}
.bwlob .r{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:14px;background:#0d0a26aa;border:1px solid #ffffff17;animation:pop .4s backwards}
.bwlob .r .av{width:38px;height:38px;flex:none}.bwlob .r .nm{font-size:14px;max-width:none}.bwlob .r>div{flex:1;min-width:0}
.bwlob .r img{width:34px;height:34px;filter:drop-shadow(0 3px 5px #000a)}
@keyframes deal{from{transform:translateY(90px) rotate(-10deg) scale(.6);opacity:0}}
@keyframes drop{from{transform:translateY(140px) scale(.8);opacity:0}}
@keyframes slam{from{transform:translate(-26px,-70px) rotate(-14deg) scale(1.35);opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fan{from{transform:translateY(60px) rotate(0) scale(.5);opacity:0}}
@keyframes fl{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1;transform:translateY(-12px) scale(1.3)}100%{transform:translateY(-100px) scale(1);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes bob{to{transform:translateY(-10px) rotate(6deg)}}
/* ===== клуб: быстрая игра, фишки, задания, коллекция. Цвета и кнопки берутся из темы игры (--gold, .btn, .pc) ===== */
#app.ent{overflow-y:auto;overflow-x:hidden}
.clubbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:2px 0}
.clubbar:empty{display:none}
.cb{display:flex;align-items:center;gap:5px;border:1px solid #ffffff2a;background:#0000002e;color:inherit;border-radius:999px;padding:6px 11px 6px 8px;font:700 13px Manrope,sans-serif;cursor:pointer;line-height:1}
.cb b{font-weight:800;color:var(--gold)}.cb small{opacity:.65;font-size:11px}
.cchip{width:18px;height:18px;flex:none;vertical-align:-4px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;max-width:420px;margin:6px auto 0;padding:12px 18px}
.qbtn b{font-size:18px;font-weight:inherit}.qbtn small{font-size:11.5px;opacity:.78;font-weight:700;text-transform:none;letter-spacing:0;font-family:Manrope,sans-serif}
.onl{text-align:center;font-size:12px;opacity:.75;margin:2px 10px 6px;min-height:16px}
.onl b{color:var(--gold)}
.onl .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;margin-right:6px;animation:pulse 1s infinite alternate}
.ef{display:flex;flex-direction:column;gap:7px;width:100%;max-width:420px;margin:0 auto}
.rmr{display:flex;gap:7px}.rmr input{flex:1;min-width:0}.rmr .btn{flex:none}
.erow{display:flex;gap:6px;justify-content:center;margin:8px auto 4px;width:100%;max-width:420px}
.erow .btn{flex:1;min-width:0;padding:10px 4px;font-size:12.5px;position:relative;white-space:nowrap}

function svgP(mk){const P=new Path2D(),n=x=>+x;

  mk.replace(/<circle cx="([\d.]+)" cy="([\d.]+)" r="([\d.]+)"\/>/g,(_,x,y,r)=>{P.moveTo(n(x)+n(r),n(y));P.arc(n(x),n(y),n(r),0,Math.PI*2);return''});

  mk.replace(/<rect x="([\d.]+)" y="([\d.]+)" width="([\d.]+)" height="([\d.]+)"[^/]*\/>/g,(_,x,y,w,h)=>{P.rect(n(x),n(y),n(w),n(h));return''});return P}
